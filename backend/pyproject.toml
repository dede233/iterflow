[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "iterflow-api"
version = "1.5.0"
description = "Standalone requirements and version management system"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.116,<1.0",
  "uvicorn[standard]>=0.35,<1.0",
  "sqlalchemy>=2.0,<3.0",
  "greenlet>=3.5,<4.0",
  "psycopg[binary]>=3.2,<4.0",
  "alembic>=1.16,<2.0",
  "pydantic>=2.11,<3.0",
  "pydantic-settings>=2.10,<3.0",
  "pyjwt>=2.10,<3.0",
  "pwdlib[argon2]>=0.2,<1.0",
  "redis>=6.0,<7.0",
  "python-multipart>=0.0.20,<1.0",
  "boto3>=1.40,<2.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8.4,<9.0",
  "pytest-cov>=6.2,<7.0",
  "httpx>=0.28,<1.0",
  "httpx2>=2.13,<3.0",
  "pip-audit>=2.7,<3.0",
  "ruff>=0.12,<1.0",
  "mypy>=1.17,<2.0"
]

[tool.setuptools.packages.find]
include = ["app*"]
exclude = ["alembic*", "tests*"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP", "RUF"]
ignore = ["B008"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
