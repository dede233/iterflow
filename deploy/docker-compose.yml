name: iterflow

x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "5"

x-backend: &backend
  image: iterflow-api:${BUILD_SHA:-local}
  build: ../backend
  environment: &backend-env
    DATABASE_URL: ${DATABASE_URL:?DATABASE_URL is required}
    REDIS_URL: ${REDIS_URL:?REDIS_URL is required}
    JWT_SECRET: ${JWT_SECRET:?JWT_SECRET is required}
    JWT_ACCESS_TTL_MINUTES: ${JWT_ACCESS_TTL_MINUTES:-30}
    JWT_REFRESH_TTL_DAYS: ${JWT_REFRESH_TTL_DAYS:-14}
    APP_ENV: ${APP_ENV:-production}
    CORS_ORIGINS: ${CORS_ORIGINS:-}
    ALLOWED_HOSTS: ${ALLOWED_HOSTS:?ALLOWED_HOSTS is required}
    TRUST_PROXY_HEADERS: ${TRUST_PROXY_HEADERS:-true}
    LOG_LEVEL: ${LOG_LEVEL:-INFO}
    ENABLE_API_DOCS: ${ENABLE_API_DOCS:-false}
    BUILD_SHA: ${BUILD_SHA:-unknown}
    STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
    LOCAL_STORAGE_PATH: /app/data/uploads
    S3_ENDPOINT: ${S3_ENDPOINT:-}
    S3_ACCESS_KEY: ${S3_ACCESS_KEY:-}
    S3_SECRET_KEY: ${S3_SECRET_KEY:-}
    S3_BUCKET: ${S3_BUCKET:-iterflow}
    S3_REGION: ${S3_REGION:-us-east-1}
    INIT_ADMIN_USERNAME: ${INIT_ADMIN_USERNAME:?INIT_ADMIN_USERNAME is required}
    INIT_ADMIN_PASSWORD: ${INIT_ADMIN_PASSWORD:-}
  volumes:
    - uploads:/app/data/uploads
  security_opt:
    - no-new-privileges:true
  cap_drop:
    - ALL
  logging: *logging

services:
  db:
    image: postgres:17.7-alpine3.22
    container_name: iterflow-db
    environment:
      POSTGRES_DB: iterflow
      POSTGRES_USER: iterflow
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required}
    ports:
      - "127.0.0.1:${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U iterflow -d iterflow"]
      interval: 5s
      timeout: 5s
      retries: 12

  redis:
    image: redis:8.2.2-alpine3.22
    container_name: iterflow-redis
    command: redis-server --appendonly yes
    ports:
      - "127.0.0.1:${REDIS_PORT:-6379}:6379"
    volumes:
      - redisdata:/data
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    logging: *logging
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 12

  migrate:
    <<: *backend
    container_name: iterflow-migrate
    command: ["alembic", "upgrade", "head"]
    depends_on:
      db:
        condition: service_healthy
    restart: "no"

  seed:
    <<: *backend
    container_name: iterflow-seed
    command: ["python", "-m", "app.cli.seed"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: "no"

  api:
    <<: *backend
    container_name: iterflow-api
    ports:
      - "127.0.0.1:${API_PORT:-8000}:8000"
    depends_on:
      seed:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test:
        - CMD
        - python
        - -c
        - >-
          import urllib.request;
          urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=5)
      interval: 10s
      timeout: 5s
      retries: 12

  web:
    image: iterflow-web:${BUILD_SHA:-local}
    build: ../frontend
    container_name: iterflow-web
    ports:
      - "${WEB_BIND_HOST:-127.0.0.1}:${WEB_PORT:-8080}:8080"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    logging: *logging
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1:8080/"]
      interval: 10s
      timeout: 5s
      retries: 12

volumes:
  pgdata:
  redisdata:
  uploads:
