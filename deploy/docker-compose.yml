services:
  db:
    image: postgres:17
    environment:
      POSTGRES_DB: rvms
      POSTGRES_USER: rvms
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-CHANGE_ME}
    volumes: [pgdata:/var/lib/postgresql/data]
    healthcheck: { test: ["CMD-SHELL", "pg_isready -U rvms"], interval: 10s, timeout: 5s, retries: 5 }
  redis:
    image: redis:8-alpine
    volumes: [redisdata:/data]
  minio:
    image: minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-CHANGE_ME}
    volumes: [miniodata:/data]
  api:
    build: ../backend
    env_file: ../.env
    environment:
      DATABASE_URL: postgresql+psycopg://rvms:${POSTGRES_PASSWORD:-CHANGE_ME}@db:5432/rvms
      REDIS_URL: redis://redis:6379/0
      S3_ENDPOINT: http://minio:9000
    depends_on: { db: { condition: service_healthy }, redis: { condition: service_started }, minio: { condition: service_started } }
  web:
    build: ../frontend
    ports: ["8080:80"]
    depends_on: [api]
volumes: { pgdata: {}, redisdata: {}, miniodata: {} }
