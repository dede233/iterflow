openapi: 3.1.0
info:
  title: IterFlow API
  version: 1.8.1
  description: IterFlow 当前开发契约：在 V1.8.1 基础上增加受保护的接口文档入口。该快照不代表新的正式发布；历史发布契约和标签保持不变。
servers:
- url: /api/v1
tags:
- name: Auth
- name: Dashboard
- name: Feedback
- name: Requirement
- name: Version
- name: Release
- name: Audit
- name: Notification
- name: Collaboration
- name: System
- name: File
paths:
  /auth/login:
    post:
      tags:
      - Auth
      summary: 登录
      operationId: login_api_v1_auth_login_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: 未登录或登录凭证不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/refresh:
    post:
      tags:
      - Auth
      summary: 刷新 Token
      operationId: refresh_api_v1_auth_refresh_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: 未登录或登录凭证不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/logout:
    post:
      tags:
      - Auth
      summary: 退出登录并撤销当前 Refresh Session
      operationId: logout_api_v1_auth_logout_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          description: 未登录或登录凭证不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /auth/change-password:
    post:
      tags:
      - Auth
      summary: 修改密码并撤销旧 Refresh Session
      operationId: change_password_api_v1_auth_change_password_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
        required: true
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: 未登录或登录凭证不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: 业务状态或 revision 冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
      security:
      - bearerAuth: []
  /auth/me:
    get:
      tags:
      - Auth
      summary: 获取当前登录态和权限
      operationId: me_api_v1_auth_me_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMe'
        '401':
          description: 未登录或登录凭证不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
  /dashboard/overview:
    get:
      tags:
      - Dashboard
      summary: 获取权限感知的业务概览
      description: 需要 dashboard.view。各领域 section 仅在拥有对应 rd.*.view 或 * 权限时返回，否则为 null；所有统计按当前用户的 SELF/ALL
        DataScope 在数据库查询中直接过滤。
      operationId: get_dashboard_overview_api_v1_dashboard_overview_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/DashboardOverviewOut'
        '401':
          description: 未登录或登录凭证不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 无权执行该操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
  /docs/openapi:
    get:
      tags:
      - System
      summary: 查看接口文档
      operationId: api_documentation_api_v1_docs_openapi_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                additionalProperties: true
                type: object
                title: Response Api Documentation Api V1 Docs Openapi Get
        '401':
          description: 未登录或登录凭证不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 无权执行该操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      security:
      - bearerAuth: []
      description: 仅允许启用的系统角色 SUPER_ADMIN 或 DEVELOPMENT_LEAD 读取当前 OpenAPI 文档。权限、账号停用和首次改密限制由后端实时执行；响应禁止缓存。
  /audits:
    get:
      tags:
      - Audit
      summary: 审计中心查询
      operationId: list_audits_api_v1_audits_get
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Size
      - name: entity_type
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 32
          - type: 'null'
          title: Entity Type
      - name: entity_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          title: Entity Id
      - name: action
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            minLength: 1
            maxLength: 64
          - type: 'null'
          title: Action
      - name: operator_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          title: Operator Id
      - name: time_from
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Time From
      - name: time_to
        in: query
        required: false
        schema:
          anyOf:
          - type: string
            format: date-time
          - type: 'null'
          title: Time To
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: 未登录或登录凭证不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 无权执行该操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      description: 仅返回当前用户具有业务对象查看权限且处于其数据范围内的审计记录。time_from 与 time_to 共同组成时间范围。
  /audits/{audit_id}:
    get:
      tags:
      - Audit
      summary: 审计记录详情
      operationId: get_audit_api_v1_audits__audit_id__get
      security:
      - bearerAuth: []
      parameters:
      - name: audit_id
        in: path
        required: true
        schema:
          type: integer
          title: Audit Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditOut'
        '404':
          description: 资源不存在或不在当前数据范围
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: 未登录或登录凭证不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 无权执行该操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      description: 详情与列表使用相同的业务对象权限和数据范围校验。
  /feedbacks:
    get:
      tags:
      - Feedback
      summary: 反馈列表
      description: keyword trim 后按 feedback_no/title/description 大小写不敏感的字面子串匹配;反斜杠、百分号和下划线不作通配符。空白视为无筛选。V1.7
        相对 V1.6 的 wildcard 行为发生兼容性变化。所有条件与 DataScope 使用 AND, items/total 一致。
      operationId: list_feedbacks_api_v1_feedbacks_get
      security:
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Page Size
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/FeedbackStatus'
          - type: 'null'
          title: Status
      - name: feedback_type
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/FeedbackType'
          - type: 'null'
          title: Feedback Type
      - name: urgency
        in: query
        required: false
        schema:
          anyOf:
          - $ref: '#/components/schemas/FeedbackUrgency'
          - type: 'null'
          title: Urgency
      - name: system_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: System Id
      - name: module_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          title: Module Id
      - name: keyword
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Keyword
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: 未登录或登录凭证不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 无权执行该操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - Feedback
      summary: 提交反馈
      operationId: create_feedback_api_v1_feedbacks_post
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackCreate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: 未登录或登录凭证不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 无权执行该操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
  /feedbacks/{feedback_id}:
    get:
      tags:
      - Feedback
      summary: 反馈详情
      operationId: get_feedback_api_v1_feedbacks__feedback_id__get
      security:
      - bearerAuth: []
      parameters:
      - name: feedback_id
        in: path
        required: true
        schema:
          type: integer
          title: Feedback Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: 未登录或登录凭证不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 无权执行该操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    patch:
      tags:
      - Feedback
      summary: 编辑反馈
      operationId: update_feedback_api_v1_feedbacks__feedback_id__patch
      security:
      - bearerAuth: []
      parameters:
      - name: feedback_id
        in: path
        required: true
        schema:
          type: integer
          title: Feedback Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackOut'
        '404':
          description: 资源不存在或不在当前数据范围
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: revision CAS 冲突 (40910) 或该操作的业务冲突
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/RevisionConflictResponse'
                - $ref: '#/components/schemas/ErrorResponse'
                title: Response 409 Update Feedback Api V1 Feedbacks  Feedback Id  Patch
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: 未登录或登录凭证不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 无权执行该操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      description: 必须携带 revision；过期 revision 返回 409。
  /feedbacks/{feedback_id}/status:
    patch:
      tags:
      - Feedback
      summary: 反馈状态变更
      operationId: change_feedback_status_api_v1_feedbacks__feedback_id__status_patch
      security:
      - bearerAuth: []
      parameters:
      - name: feedback_id
        in: path
        required: true
        schema:
          type: integer
          title: Feedback Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackStatusChange'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackOut'
        '404':
          description: 资源不存在或不在当前数据范围
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '409':
          description: revision CAS 冲突 (40910) 或该操作的业务冲突
          content:
            application/json:
              schema:
                anyOf:
                - $ref: '#/components/schemas/RevisionConflictResponse'
                - $ref: '#/components/schemas/ErrorResponse'
                title: Response 409 Change Feedback Status Api V1 Feedbacks  Feedback Id  Status Patch
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: 未登录或登录凭证不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 无权执行该操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      description: 集中式状态机；必须携带 revision；非法迁移返回 409；ManualFeedbackStatus 之外的值返回 422。
  /feedbacks/{feedback_id}/attachments:
    get:
      tags:
      - Feedback
      summary: 反馈附件列表
      operationId: list_feedback_attachments_api_v1_feedbacks__feedback_id__attachments_get
      security:
      - bearerAuth: []
      parameters:
      - name: feedback_id
        in: path
        required: true
        schema:
          type: integer
          title: Feedback Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttachmentOut'
                title: Response List Feedback Attachments Api V1 Feedbacks  Feedback Id  Attachments Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: 未登录或登录凭证不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 无权执行该操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - Feedback
      summary: 上传反馈附件
      operationId: add_feedback_attachment_api_v1_feedbacks__feedback_id__attachments_post
      security:
      - bearerAuth: []
      parameters:
      - name: feedback_id
        in: path
        required: true
        schema:
          type: integer
          title: Feedback Id
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_add_feedback_attachment_api_v1_feedbacks__feedback_id__attachments_post'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentOut'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: 未登录或登录凭证不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 无权执行该操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      description: 在反馈数据范围内上传并以 file_id 建立 FEEDBACK 附件关系；仅存 file_id，不存物理路径。
  /feedbacks/{feedback_id}/attachments/{file_id}/download:
    get:
      tags:
      - Feedback
      summary: 下载反馈附件
      operationId: download_feedback_attachment_api_v1_feedbacks__feedback_id__attachments__file_id__download_get
      security:
      - bearerAuth: []
      parameters:
      - name: feedback_id
        in: path
        required: true
        schema:
          type: integer
          title: Feedback Id
      - name: file_id
        in: path
        required: true
        schema:
          type: integer
          title: File Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema: {}
        '404':
          description: 资源不存在或不在当前数据范围
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: 未登录或登录凭证不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 无权执行该操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      description: 按反馈数据范围 + 附件关系鉴权，非文件属主鉴权。
  /feedbacks/{feedback_id}/comments:
    get:
      tags:
      - Feedback
      summary: 反馈评论列表
      operationId: list_feedback_comments_api_v1_feedbacks__feedback_id__comments_get
      security:
      - bearerAuth: []
      parameters:
      - name: feedback_id
        in: path
        required: true
        schema:
          type: integer
          title: Feedback Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommentOut'
                title: Response List Feedback Comments Api V1 Feedbacks  Feedback Id  Comments Get
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: 未登录或登录凭证不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 无权执行该操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
    post:
      tags:
      - Feedback
      summary: 发表反馈评论
      operationId: create_feedback_comment_api_v1_feedbacks__feedback_id__comments_post
      security:
      - bearerAuth: []
      parameters:
      - name: feedback_id
        in: path
        required: true
        schema:
          type: integer
          title: Feedback Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentOut'
        '422':
