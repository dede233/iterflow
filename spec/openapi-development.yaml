openapi: 3.1.0
info:
  title: IterFlow API
  version: 1.8.1
  description: IterFlow 当前开发契约：在 V1.8.1 基础上增加受保护的接口文档入口。该快照不代表新的正式发布；历史发布契约和标签保持不变。
servers:
- url: /api/v1
tags:
- name: Auth
- name: Dashboard
- name: Feedback
- name: Requirement
- name: Version
- name: Release
- name: Audit
- name: Notification
- name: Collaboration
- name: System
- name: File
- name: announcements
  description: 迭程产品更新公告、草稿管理与账号已读记录
paths:
  /requirements/filter-options/participants:
    get:
      tags:
      - Requirement
      summary: 需求参与人筛选选项
      operationId: requirements_filter_options_participants_get
      security:
      - bearerAuth: []
      parameters:
      - name: keyword
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
          default: ''
          title: Keyword
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Page Size
      - name: selected_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          title: Selected Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterOptionPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: 未登录或登录凭证不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 无权执行该操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      description: 需要 rd.requirement.view。仅返回当前 Requirement DataScope 内未删除需求的有效参与人，保留已停用账号并标注；不要求用户管理或需求编辑权限，不返回用户名、邮箱或角色。
        keyword trim 后按可见标签做大小写不敏感的字面部分匹配；分页稳定且 total 去重。selected_id 与搜索及权限范围使用 AND 组合，不存在或不可见时返回空列表。
  /requirements/filter-options/versions:
    get:
      tags:
      - Requirement
      summary: 需求版本筛选选项
      operationId: requirements_filter_options_versions_get
      security:
      - bearerAuth: []
      parameters:
      - name: keyword
        in: query
        required: false
        schema:
          type: string
          maxLength: 100
          default: ''
          title: Keyword
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 100
          minimum: 1
          default: 20
          title: Page Size
      - name: selected_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
            minimum: 1
          - type: 'null'
          title: Selected Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FilterOptionPage'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
        '401':
          description: 未登录或登录凭证不可用
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '403':
          description: 无权执行该操作
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
      description: 需要 rd.requirement.view。仅返回当前 Requirement DataScope 内未删除需求的 current_version_id 关联选项。只有同时具备
        rd.version.view 且通过 Version DataScope 时返回版本号和名称，否则仅返回需求已公开的版本 ID 占位标签；搜索不匹配不可见的版本号或名称。 keyword
        trim 后按可见标签做大小写不敏感的字面部分匹配；分页稳定且 total 去重。selected_id 与搜索及权限范围使用 AND 组合，不存在或不可见时返回空列表。
