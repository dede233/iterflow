        title:
          type: string
        requirement_type:
          type: string
        priority:
          type: string
          enum:
          - P0
          - P1
          - P2
          - P3
          - P4
        system_id:
          type:
          - integer
          - 'null'
        module_id:
          type:
          - integer
          - 'null'
        owner_id:
          type:
          - integer
          - 'null'
        description:
          type: string
        acceptance_criteria:
          type:
          - string
          - 'null'
        revision:
          type: integer
          minimum: 1
    RequirementStatusChange:
      type: object
      required:
      - status
      - revision
      properties:
        status:
          type: string
          enum:
          - DRAFT
          - CONFIRMED
          - PLANNED
          - DEVELOPING
          - TESTING
          - DONE
          - PAUSED
          - CANCELED
        reason:
          type:
          - string
