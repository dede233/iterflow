        type:
          type: string
          enum:
          - CREATE_NEW
          - LINK_EXISTING
        revision:
          type: integer
          minimum: 1
        requirement_title:
          type:
          - string
          - 'null'
        requirement_type:
          type:
          - string
          - 'null'
        priority:
          type: string
          enum:
