        actual_result:
          type:
          - string
          - 'null'
        reproduce_steps:
          type:
          - string
          - 'null'
        duplicate_of_id:
          type:
          - integer
          - 'null'
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
