        name:
          type: string
        status:
          type: string
          enum:
          - PLANNING
          - DEVELOPING
          - TESTING
          - READY
          - RELEASED
          - CANCELED
        owner_id:
          type:
          - integer
          - 'null'
        planned_release_date:
          type:
          - string
          - 'null'
          format: date
        released_at:
          type:
          - string
          - 'null'
          format: date-time
        description:
          type:
          - string
          - 'null'
        revision:
          type: integer
    UserCreate:
      type: object
      required:
