          type: string
        title:
          type: string
        requirement_type:
          type: string
        source:
          type: string
          enum:
          - DIRECT
          - FEEDBACK
        priority:
          type: string
          enum:
          - P0
          - P1
          - P2
          - P3
          - P4
        status:
          type: string
          enum:
          - DRAFT
          - CONFIRMED
          - PLANNED
          - DEVELOPING
          - TESTING
          - DONE
          - ONLINE
          - PAUSED
          - CANCELED
        owner_id:
          type:
          - integer
          - 'null'
        current_version_id:
          type:
          - integer
          - 'null'
        description:
          type: string
