          - SYSTEM_ISSUE
          - DATA_ISSUE
          - UI_UX
          - OTHER
        urgency:
          type: string
          enum:
          - NORMAL
          - URGENT
          - CRITICAL
        status:
          type: string
          enum:
          - NEW
          - ACCEPTED
          - REQUIREMENT_LINKED
