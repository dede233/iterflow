    RequirementCreate:
      type: object
      required:
      - title
      - requirement_type
      - description
      properties:
        title:
          type: string
        requirement_type:
          type: string
        priority:
          type: string
          enum:
          - P0
          - P1
          - P2
          - P3
          - P4
          default: P2
        system_id:
          type:
          - integer
          - 'null'
        module_id:
          type:
          - integer
          - 'null'
        owner_id:
          type:
          - integer
          - 'null'
        description:
          type: string
        acceptance_criteria:
          type:
          - string
          - 'null'
