openapi: 3.1.0
info:
  title: IterFlow API
  version: 1.5.0
  description: 独立部署版 V1.5 完整开发基线接口契约。所有关键写操作通过 revision 乐观锁避免多人编辑静默覆盖。
servers:
- url: /api/v1
tags:
- name: Auth
- name: Feedback
- name: Requirement
- name: Version
- name: Release
- name: Audit
- name: Notification
- name: Collaboration
- name: System
- name: File
paths:
  /auth/login:
    post:
      tags:
      - Auth
      summary: 登录
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/LoginRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: 用户名或密码错误
  /auth/refresh:
    post:
      tags:
      - Auth
      summary: 刷新 Token
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: Refresh Token 无效、已过期或已撤销
  /auth/logout:
    post:
      tags:
      - Auth
      summary: 退出登录并撤销当前 Refresh Session
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RefreshRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/LogoutResponse'
        '401':
          description: Refresh Token 无效或已过期
  /auth/change-password:
    post:
      tags:
      - Auth
      summary: 修改密码并撤销旧 Refresh Session
      security:
      - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/ChangePasswordRequest'
      responses:
        '200':
          description: 成功，返回新 Token Pair
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/TokenPair'
        '401':
          description: 当前密码错误或用户不可用
        '409':
          description: 密码被并发修改
  /auth/me:
    get:
      tags:
      - Auth
      summary: 获取当前登录态和权限
      security:
      - bearerAuth: []
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuthMe'
        '401':
          description: Access Token 无效或用户不可用
  /feedbacks:
    get:
      tags:
      - Feedback
      summary: 反馈列表
      security: &id001
      - bearerAuth: []
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: status
        in: query
        required: false
        schema:
          type: string
          enum:
          - NEW
          - ACCEPTED
          - REQUIREMENT_LINKED
          - ONLINE
          - DUPLICATE
          - CANNOT_REPRODUCE
          - CLOSED
      - name: feedback_type
        in: query
        required: false
        schema:
          type: string
          enum:
          - NEW_FEATURE
          - FEATURE_OPTIMIZATION
          - SYSTEM_ISSUE
          - DATA_ISSUE
          - UI_UX
          - OTHER
      - name: urgency
        in: query
        required: false
        schema:
          type: string
          enum:
          - NORMAL
          - URGENT
          - CRITICAL
      - name: system_id
        in: query
        required: false
        schema:
          type: integer
      - name: module_id
        in: query
        required: false
        schema:
          type: integer
      - name: keyword
        in: query
        required: false
        schema:
          type: string
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/FeedbackPage'
    post:
      tags:
      - Feedback
      summary: 提交反馈
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackCreate'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feedback'
  /feedbacks/{feedback_id}:
    get:
      tags:
      - Feedback
      summary: 反馈详情
      security: *id001
      parameters:
      - name: feedback_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feedback'
    patch:
      tags:
      - Feedback
      summary: 编辑反馈
      description: 必须携带 revision；过期 revision 返回 409。
      security: *id001
      parameters:
      - name: feedback_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackUpdate'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feedback'
        '409':
          description: 并发冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
  /feedbacks/{feedback_id}/status:
    patch:
      tags:
      - Feedback
      summary: 反馈状态变更
      description: 集中式状态机；必须携带 revision；非法迁移返回 409；ManualFeedbackStatus 之外的值返回 422。
      security:
      - bearerAuth: []
      parameters:
      - name: feedback_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackStatusChange'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Feedback'
        '409':
          description: 非法状态迁移或并发冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
  /feedbacks/{feedback_id}/attachments:
    get:
      tags:
      - Feedback
      summary: 反馈附件列表
      security: &id002
      - bearerAuth: []
      parameters:
      - &id003
        name: feedback_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/AttachmentOut'
    post:
      tags:
      - Feedback
      summary: 上传反馈附件
      description: 在反馈数据范围内上传并以 file_id 建立 FEEDBACK 附件关系；仅存 file_id，不存物理路径。
      security: *id002
      parameters:
      - *id003
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AttachmentOut'
  /feedbacks/{feedback_id}/attachments/{file_id}/download:
    get:
      tags:
      - Feedback
      summary: 下载反馈附件
      description: 按反馈数据范围 + 附件关系鉴权，非文件属主鉴权。
      security: *id002
      parameters:
      - *id003
      - name: file_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: 文件流
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: 附件不存在或无权访问
  /feedbacks/{feedback_id}/comments:
    get:
      tags:
      - Feedback
      summary: 反馈评论列表
      security: *id002
      parameters:
      - *id003
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/CommentOut'
    post:
      tags:
      - Feedback
      summary: 发表反馈评论
      security: *id002
      parameters:
      - *id003
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CommentCreate'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/CommentOut'
  /feedbacks/{feedback_id}/convert:
    post:
      tags:
      - Feedback
      summary: 反馈转正式需求
      description: Requirement + 关系表 + Feedback 回填 + 审计日志同一事务。
      security: *id001
      parameters:
      - name: feedback_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/FeedbackConvertRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementOut'
        '404':
          description: 反馈或目标需求不存在
        '409':
          description: 并发冲突/非法状态迁移
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
        '422':
          description: 参数校验失败
  /requirements:
    get:
      tags:
      - Requirement
      summary: 需求列表
      security: *id001
      parameters: &id004
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: version_id
        in: query
        required: false
        schema:
          type: integer
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementPage'
    post:
      tags:
      - Requirement
      summary: 直接新建正式需求
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequirementCreate'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementOut'
  /requirements/{requirement_id}:
    get:
      tags:
      - Requirement
      summary: 需求详情
      security: *id001
      parameters:
      - name: requirement_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementOut'
    patch:
      tags:
      - Requirement
      summary: 编辑需求
      security: *id001
      parameters:
      - name: requirement_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequirementUpdate'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementOut'
        '409':
          description: 并发冲突/非法状态迁移
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
  /requirements/{requirement_id}/status:
    patch:
      tags:
      - Requirement
      summary: 变更需求状态
      security: *id001
      parameters:
      - name: requirement_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequirementStatusChange'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RequirementOut'
        '409':
          description: 并发冲突/非法状态迁移
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
  /requirements/{requirement_id}/feedbacks:
    get:
      tags:
      - Requirement
      summary: 需求来源反馈
      security:
      - bearerAuth: []
      parameters:
      - name: requirement_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/LinkedFeedbackOut'
  /versions:
    get:
      tags:
      - Version
      summary: 版本列表
      security: *id001
      parameters: *id004
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionPage'
    post:
      tags:
      - Version
      summary: 创建版本
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionCreate'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionOut'
  /versions/{version_id}:
    get:
      tags:
      - Version
      summary: 版本详情
      security: *id001
      parameters:
      - name: version_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionOut'
    patch:
      tags:
      - Version
      summary: 编辑版本
      security: *id001
      parameters:
      - name: version_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionUpdate'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionOut'
        '409':
          description: 并发冲突/非法状态迁移/版本冻结
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
  /versions/{version_id}/status:
    patch:
      tags:
      - Version
      summary: 变更版本状态（禁止进入 RELEASED）
      description: READY 可退回 TESTING，但必须填写 reason。RELEASED 只能通过发布接口进入。
      security: *id001
      parameters:
      - name: version_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/VersionStatusChange'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionOut'
        '409':
          description: 并发冲突/非法状态迁移/版本冻结
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
  /versions/{version_id}/requirements:
    get:
      tags:
      - Version
      summary: 版本需求清单与进度
      security: &id005
      - bearerAuth: []
      parameters:
      - &id006
        name: version_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionRequirementsOut'
    post:
      tags:
      - Version
      summary: 向版本添加需求
      description: 通过 VersionService；READY/RELEASED/CANCELED 冻结返回 409。
      security: *id005
      parameters:
      - *id006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/AddRequirementRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionOut'
        '409':
          description: 并发冲突/非法状态迁移/版本冻结
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
  /versions/{version_id}/requirements/move:
    post:
      tags:
      - Version
      summary: 迁移需求到该版本
      security: *id005
      parameters:
      - *id006
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/MoveRequirementRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionOut'
        '409':
          description: 并发冲突/非法状态迁移/版本冻结
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
  /versions/{version_id}/requirements/{requirement_id}:
    delete:
      tags:
      - Version
      summary: 从版本移除需求
      security: *id005
      parameters:
      - *id006
      - name: requirement_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RemoveRequirementRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/VersionOut'
        '409':
          description: 并发冲突/非法状态迁移/版本冻结
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
  /versions/{version_id}/publish:
    post:
      tags:
      - Version
      summary: 发布版本
      description: 只允许 READY，且 V1.5 仅支持成功发布。Release(SUCCESS) + Version + DONE Requirement -> ONLINE +
        Feedback -> ONLINE 同一业务事务。
      security: *id001
      parameters:
      - name: version_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/PublishVersionRequest'
      responses:
        '200':
          description: 发布成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishResult'
        '409':
          description: 版本未就绪/存在未完成需求/并发冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
        '404':
          description: 版本不存在或无权访问
  /versions/{version_id}/publish/check:
    post:
      tags:
      - Version
      summary: 发布前检查
      description: 运行与 publish 相同的前置检查；通过返回 200，未通过返回 409 并含 checks。
      security: &id007
      - bearerAuth: []
      parameters:
      - name: version_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: 检查通过
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/PublishCheckResult'
        '409':
          description: 检查未通过
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
        '404':
          description: 版本不存在或无权访问
  /releases:
    get:
      tags:
      - Release
      summary: 发布记录
      security: *id001
      parameters: *id004
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleasePage'
  /releases/{release_id}:
    get:
      tags:
      - Release
      summary: 发布记录详情
      security: *id007
      parameters:
      - name: release_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ReleaseOut'
        '404':
          description: 发布记录不存在或无权访问
  /audits:
    get:
      tags:
      - Audit
      summary: 审计中心查询
      description: 仅返回当前用户具有业务对象查看权限且处于其数据范围内的审计记录。time_from 与 time_to 共同组成时间范围。
      security: *id001
      parameters:
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
      - name: size
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          maximum: 100
          default: 20
      - name: entity_type
        in: query
        required: false
        schema:
          type: string
      - name: entity_id
        in: query
        required: false
        schema:
          type: integer
      - name: action
        in: query
        required: false
        schema:
          type: string
      - name: operator_id
        in: query
        required: false
        schema:
          type: integer
      - name: time_from
        in: query
        required: false
        schema:
          type: string
          format: date-time
      - name: time_to
        in: query
        required: false
        schema:
          type: string
          format: date-time
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditPage'
        '403':
          description: 缺少 sys.audit.view 或对象查看权限
  /audits/{audit_id}:
    get:
      tags:
      - Audit
      summary: 审计记录详情
      description: 详情与列表使用相同的业务对象权限和数据范围校验。
      security: *id001
      parameters:
      - name: audit_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/AuditOut'
        '404':
          description: 审计记录不存在或无权访问
  /notifications:
    get:
      tags:
      - Notification
      summary: 通知中心
      security: *id001
      parameters:
      - name: unread_only
        in: query
        required: false
        schema:
          type: boolean
          default: false
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Notification'
  /notifications/{notification_id}/read:
    post:
      tags:
      - Notification
      summary: 标记通知已读
      security: *id001
      parameters:
      - name: notification_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
  /editing/start:
    post:
      tags:
      - Collaboration
      summary: 进入编辑并获取他人编辑提示
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditingRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
  /editing/heartbeat:
    post:
      tags:
      - Collaboration
      summary: 编辑心跳续期
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditingRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
  /editing/end:
    post:
      tags:
      - Collaboration
      summary: 结束编辑提示
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EditingRequest'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
  /users:
    get:
      tags:
      - System
      summary: 用户列表
      security: *id001
      parameters: *id004
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/UserPage'
    post:
      tags:
      - System
      summary: 创建用户
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserCreate'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          description: 无权限、数据范围不足，或普通管理员尝试创建带 SUPER_ADMIN 的用户
        '409':
          description: 用户名已存在
  /users/{user_id}/status:
    patch:
      tags:
      - System
      summary: 启停用户
      security: *id001
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserStatusChange'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          description: 无权修改拥有 SUPER_ADMIN 角色的用户状态
        '409':
          description: revision 冲突或最后一个有效 SUPER_ADMIN 保护
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
        '404':
          description: 用户不存在
  /users/{user_id}:
    get:
      tags:
      - System
      summary: 用户详情
      description: SELF 数据范围只能查看当前登录用户自己的账号信息。
      security: *id001
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          description: 数据范围不足
        '404':
          description: 用户不存在
    patch:
      tags:
      - System
      summary: 编辑用户基本信息
      description: 凭 revision 乐观锁更新；账号状态、角色和密码使用专用接口。
      security: *id001
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserUpdate'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          description: 无权限或数据范围不足
        '404':
          description: 用户不存在
        '409':
          description: revision 冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
  /users/{user_id}/roles:
    put:
      tags:
      - System
      summary: 分配用户角色
      description: 仅 ALL 数据范围的用户管理权限可执行；凭 revision 乐观锁更新。
      security: *id001
      parameters:
      - name: user_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/UserRoleUpdate'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/User'
        '403':
          description: 无权限、数据范围不足，或无权授予/撤销 SUPER_ADMIN
        '404':
          description: 用户不存在
        '409':
          description: revision 冲突或最后一个有效 SUPER_ADMIN 保护
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
  /roles:
    get:
      tags:
      - System
      summary: 角色列表
      security: *id001
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Role'
    post:
      tags:
      - System
      summary: 创建角色
      security: *id001
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleCreate'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '403':
          description: 无权限或数据范围不足
        '409':
          description: 角色编码已存在
  /roles/permissions:
    get:
      tags:
      - System
      summary: 权限码列表
      security: *id001
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Permission'
  /roles/{role_id}/permissions:
    put:
      tags:
      - System
      summary: 更新角色权限
      description: 仅自定义角色可修改权限；系统角色为只读基线并返回 409；revision 用于乐观锁。
      security: *id001
      parameters:
      - name: role_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RolePermissionUpdate'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '409':
          description: 系统角色只读或 revision 冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
        '404':
          description: 角色不存在
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Error'
  /roles/{role_id}:
    get:
      tags:
      - System
      summary: 角色详情
      security: *id001
      parameters:
      - name: role_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '403':
          description: 无权限或数据范围不足
        '404':
          description: 角色不存在
    patch:
      tags:
      - System
      summary: 修改角色基础信息
      description: 仅自定义角色可修改；系统角色为只读基线并返回 409。TEAM 数据范围在 V1.5 中保留，提交 TEAM 返回 422；revision 用于乐观锁。
      security: *id001
      parameters:
      - name: role_id
        in: path
        required: true
        schema:
          type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RoleUpdate'
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Role'
        '409':
          description: 系统角色只读或 revision 冲突
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Conflict'
        '422':
          description: 参数错误或尝试配置保留的 TEAM 数据范围
        '404':
          description: 角色不存在
    delete:
      tags:
      - System
      summary: 删除自定义角色
      description: 系统角色为只读基线且不可删除；仍被用户分配的自定义角色返回 409。
      security: *id001
      parameters:
      - name: role_id
        in: path
        required: true
        schema:
          type: integer
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/RoleDeleteOut'
        '403':
          description: 无权限或数据范围不足
        '404':
          description: 角色不存在
        '409':
          description: 系统角色只读或自定义角色仍被用户分配
  /systems:
    get:
      tags:
      - System
      summary: 业务系统与模块字典
      security: *id001
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
  /files:
    post:
      tags:
      - File
      summary: 上传附件
      description: MIME 白名单，单文件默认 50MB。
      security: *id001
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - file
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: 成功
          content:
            application/json:
              schema:
                type: object
        '422':
          description: 文件类型或大小不允许
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
  schemas:
    LoginRequest:
      type: object
      required:
      - username
      - password
      properties:
        username:
          type: string
        password:
          type: string
          format: password
    TokenPair:
      type: object
      required:
      - access_token
      - refresh_token
      - token_type
      - must_change_password
      properties:
        access_token:
          type: string
        refresh_token:
          type: string
        token_type:
          type: string
          example: bearer
        must_change_password:
          type: boolean
    RefreshRequest:
      type: object
      required:
      - refresh_token
      properties:
        refresh_token:
          type: string
    LogoutResponse:
      type: object
      required:
      - ok
      properties:
        ok:
          type: boolean
    ChangePasswordRequest:
      type: object
      required:
      - current_password
      - new_password
      properties:
        current_password:
          type: string
          format: password
          minLength: 6
          maxLength: 128
        new_password:
          type: string
          format: password
          minLength: 8
          maxLength: 128
    AuthMe:
      type: object
      required:
      - id
      - username
      - display_name
      - status
      - revision
      - must_change_password
      - data_scope
      - role_ids
      - permission_codes
      properties:
        id:
          type: integer
        username:
          type: string
        display_name:
          type: string
        email:
          type:
          - string
          - 'null'
        status:
          type: string
          enum:
          - ACTIVE
          - DISABLED
          - LOCKED
        revision:
          type: integer
          minimum: 1
        must_change_password:
          type: boolean
        data_scope:
          type: string
          enum:
          - SELF
          - TEAM
          - ALL
        role_ids:
          type: array
          items:
            type: integer
        permission_codes:
          type: array
          items:
            type: string
    FeedbackCreate:
      type: object
      required:
      - title
      - feedback_type
      - description
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 200
        feedback_type:
          type: string
          enum:
          - NEW_FEATURE
          - FEATURE_OPTIMIZATION
          - SYSTEM_ISSUE
          - DATA_ISSUE
          - UI_UX
          - OTHER
        urgency:
          type: string
          enum:
          - NORMAL
          - URGENT
          - CRITICAL
