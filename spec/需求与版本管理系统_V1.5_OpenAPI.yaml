          - integer
          - 'null'
        planned_release_date:
          type:
          - string
          - 'null'
          format: date
        description:
          type:
          - string
          - 'null'
    VersionUpdate:
      type: object
      required:
      - revision
      properties:
        name:
          type: string
        owner_id:
          type:
          - integer
          - 'null'
        planned_release_date:
          type:
          - string
          - 'null'
          format: date
        description:
          type:
          - string
          - 'null'
        revision:
          type: integer
          minimum: 1
    VersionStatusChange:
      type: object
      required:
      - status
      - revision
      properties:
        status:
          type: string
          enum:
          - PLANNING
          - DEVELOPING
          - TESTING
          - READY
          - CANCELED
        revision:
          type: integer
          minimum: 1
        reason:
          type:
          - string
          - 'null'
          maxLength: 500
