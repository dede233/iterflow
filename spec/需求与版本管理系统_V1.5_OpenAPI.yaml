      properties:
        username:
          type: string
        display_name:
          type: string
        password:
          type: string
        email:
          type:
          - string
          - 'null'
        mobile:
          type:
          - string
          - 'null'
        role_ids:
          type: array
          items:
            type: integer
    UserUpdate:
      type: object
      required:
      - revision
      properties:
        display_name:
          type: string
          minLength: 1
