        system_id:
          type:
          - integer
          - 'null'
        module_id:
          type:
          - integer
          - 'null'
        description:
          type: string
          minLength: 2
        expected_result:
          type:
          - string
          - 'null'
        actual_result:
          type:
          - string
          - 'null'
        reproduce_steps:
          type:
          - string
          - 'null'
    FeedbackUpdate:
      type: object
      required:
      - revision
      properties:
        title:
          type: string
          minLength: 2
          maxLength: 200
        feedback_type:
          type: string
          enum:
          - NEW_FEATURE
          - FEATURE_OPTIMIZATION
          - SYSTEM_ISSUE
          - DATA_ISSUE
          - UI_UX
          - OTHER
        urgency:
          type: string
          enum:
          - NORMAL
          - URGENT
          - CRITICAL
        system_id:
          type:
          - integer
          - 'null'
        module_id:
          type:
          - integer
          - 'null'
        description:
          type: string
          minLength: 2
        expected_result:
          type:
          - string
          - 'null'
        actual_result:
          type:
          - string
          - 'null'
        reproduce_steps:
          type:
          - string
          - 'null'
        revision:
          type: integer
          minimum: 1
    FeedbackConvertRequest:
      type: object
      required:
      - type
      - revision
